services:
  - type: web
    name: garcom-virtual-sabor-da-casa
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
